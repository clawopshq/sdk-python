[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawops"
dynamic = ["version"]
description = "The official Python library for the ClawOps Voice API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "ClawOps", email = "support@claw-ops.com" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.0,<1",
    "pydantic>=2.0.0,<3",
    "typing-extensions>=4.7.0",
]

[project.urls]
Homepage = "https://github.com/clawopshq/sdk-python"
Documentation = "https://docs.claw-ops.com"
Repository = "https://github.com/clawopshq/sdk-python"

[tool.hatch.version]
path = "src/clawops/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clawops"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "mypy>=1.0",
    "ruff>=0.1",
    "aiohttp>=3.9.0,<4",
    "google-genai>=1.60.0",
    "openai[realtime]>=2.0.0",
    # tests/agent/test_livekit_*.py 는 importorskip 으로 걸려 있다. 여기에 없으면
    # 로컬에서도 CI(publish.yml 의 pip install -e ".[dev]")에서도 **항상 skip** 되어
    # LiveKit 표면 전체가 초록불인 채 검증 0 이 된다 — 실제로 그래서 0.45.0 이
    # LiveKit 툴셋만 caller_id_mode 를 빠뜨린 채 나갔다.
    "livekit-agents>=1.6.5",
]

# Agent
agent = ["aiohttp>=3.9.0,<4"]
# OpenAI Realtime 은 websocket 전송을 위해 openai[realtime] extra 가 필요하다.
openai = ["clawops[agent]", "openai[realtime]>=2.0.0"]
anthropic-llm = ["clawops[agent]", "anthropic>=0.40.0"]
gemini = ["clawops[agent]", "google-genai>=1.60.0"]
ollama = ["clawops[agent]", "openai>=1.0.0"]
mistral = ["clawops[agent]", "openai>=1.0.0"]
groq = ["clawops[agent]", "openai>=1.0.0"]
perplexity = ["clawops[agent]", "openai>=1.0.0"]
together = ["clawops[agent]", "openai>=1.0.0"]
fireworks = ["clawops[agent]", "openai>=1.0.0"]
deepseek = ["clawops[agent]", "openai>=1.0.0"]
xai = ["clawops[agent]", "openai>=1.0.0"]
deepgram = ["clawops[agent]", "deepgram-sdk>=3.0.0"]
elevenlabs = ["clawops[agent]", "elevenlabs>=1.0.0"]
google-tts = ["clawops[agent]", "google-cloud-texttospeech>=2.0.0"]
# LiveKit Agents 를 ClawOps 전화망에 얹는다 (room 없이).
# LLM/STT/TTS 플러그인은 유저가 직접 단다: livekit-agents[openai,cartesia] 등.
# agent-all 에는 넣지 않는다 — livekit 은 ~208MB 네이티브 바이너리를 끌어오고
# Alpine(musllinux) 휠이 없어서, 원치 않는 소비자에게 강제할 수 없다 (ollama 와 동일).
livekit = ["clawops[agent]", "livekit-agents>=1.6.5"]
mcp = ["clawops[agent]", "mcp>=1.0.0"]
tracing = ["opentelemetry-api>=1.20.0"]
agent-all = [
    "clawops[openai]",
    "clawops[anthropic-llm]",
    "clawops[gemini]",
    "clawops[deepgram]",
    "clawops[elevenlabs]",
    "clawops[mcp]",
    "clawops[tracing]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py39"
line-length = 120
